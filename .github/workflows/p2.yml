name: p2

# Builds the Android GKI (android-mainline, arm64) on a stock GitHub runner and
# uploads Image + vmlinux so the local QEMU/gdbstub harness can debug it.
#
#   release : stock gki_defconfig -- matches what actually ships, for fidelity
#   debug   : + KASAN/UBSAN/DEBUG_ATOMIC_SLEEP -- for finding the bugs
#
# The two variants run as separate jobs (not a matrix) on purpose: a full
# kernel build tree does not fit twice in a runner's free disk.

on: [push]

permissions:
  contents: read

jobs:
  build:
    name: gki-${{ inputs.variant || 'both' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KSRC: /home/runner/kernel/common
      OUT: /home/runner/kernel/out

    steps:
      - uses: actions/checkout@v4

      # Fetch kernel/common (android-mainline).
      #
      # NOT git clone / git fetch: on this network both produce an empty repo
      # after 10+ minutes (kernel/common is a ~1.5 GB history). The gitiles
      # `+archive` tarball is the path that reliably works, and `git ls-remote`
      # still gives us the exact commit id for the record.
      - name: Fetch kernel/common (android-mainline tarball)
        run: |
          set -euo pipefail
          KSHA=$(git ls-remote https://android.googlesource.com/kernel/common \
                 refs/heads/android-mainline | cut -f1)
          echo "android-mainline = $KSHA" | tee "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$KSRC"
          curl -fSL --retry 3 --retry-delay 5 \
            -o /tmp/kernel.tar.gz \
            "https://android.googlesource.com/kernel/common/+archive/refs/heads/android-mainline.tar.gz"
          ls -la /tmp/kernel.tar.gz
          tar xzf /tmp/kernel.tar.gz -C "$KSRC"
          rm -f /tmp/kernel.tar.gz
          test -f "$KSRC/Makefile"
          make -s -C "$KSRC" kernelversion

      - name: Report disk before build
        run: df -h /home/runner

      - name: Build (release)
        if: inputs.variant == 'release' || inputs.variant == 'both' || inputs.variant == ''
        run: bash scripts/build-kernel.sh release

      - name: Upload release artifacts
        if: inputs.variant == 'release' || inputs.variant == 'both' || inputs.variant == ''
        uses: actions/upload-artifact@v4
        with:
          name: gki-release
          path: |
            ${{ env.OUT }}/Image
            ${{ env.OUT }}/vmlinux.gz
          retention-days: 30
          if-no-files-found: error

      # Free the object tree before the second build, otherwise the debug leg
      # dies on ENOSPC partway through.
      - name: Clean object tree before debug build
        if: inputs.variant == 'debug' || inputs.variant == 'both'
        run: |
          set -euo pipefail
          cd "$KSRC"
          rm -f "$OUT"/Image "$OUT"/vmlinux.gz
          # keep .config, drop every object file and command file
          find . -name '*.o' -delete
          find . -name '*.cmd' -delete
          df -h /home/runner

      - name: Build (debug: KASAN + UBSAN)
        if: inputs.variant == 'debug' || inputs.variant == 'both'
        run: bash scripts/build-kernel.sh debug

      - name: Upload debug artifacts
        if: inputs.variant == 'debug' || inputs.variant == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: gki-debug
          path: |
            ${{ env.OUT }}/Image
            ${{ env.OUT }}/vmlinux.gz
          retention-days: 30
          if-no-files-found: error