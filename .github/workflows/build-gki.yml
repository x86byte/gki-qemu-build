name: build-gki

# Builds the Android GKI (android-mainline, arm64) on a stock GitHub runner and
# uploads Image + vmlinux.gz so the local QEMU/gdbstub harness can debug it.
#
#   release : stock gki_defconfig -- matches what actually ships, for fidelity
#   debug   : + software KASAN / UBSAN / DEBUG_ATOMIC_SLEEP -- for finding bugs
#
# The two variants run as sequential steps in one job on purpose: two full
# kernel build trees do not fit side by side on a runner's free disk.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which build to produce
        type: choice
        options: [release, debug, both]
        default: both

permissions:
  contents: read

jobs:
  build:
    name: gki-${{ inputs.variant || 'both' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KSRC: /home/runner/kernel/common
      OUT: /home/runner/kernel/out
      # scripts/rust_is_available.sh reads these from the environment; Kbuild
      # also uses them to find the compiler and the bindings generator.
      RUSTC: rustc
      BINDGEN: bindgen

    steps:
      - uses: actions/checkout@v4

      # The stock runner image has clang but not always lld/bison/flex/openssl,
      # and the kernel build needs all of them.
      - name: Install kernel build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            lld llvm llvm-18 llvm-18-tools \
            libdwarf-dev libdw-dev libelf-dev libssl-dev \
            dwarves bc bison flex python3 cpio pkg-config
          # LLVM=1 makes the kernel build call llvm-ar / llvm-nm / llvm-objcopy
          # by bare name, so they have to be on PATH.
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          ld.lld --version
          llvm-ar --version | head -1
          # scripts/gendwarfksyms includes <dwarf.h>, but Debian/Ubuntu install
          # it under a versioned directory, not /usr/include. Symlink it into
          # place; if the package really did not provide it, the build script
          # drops GENDWARFKSYMS and we still get a bootable Image.
          DW="$(find /usr/include -name dwarf.h 2>/dev/null | head -1 || true)"
          echo "dwarf.h found at: ${DW:-<none>}"
          if [ -n "$DW" ] && [ ! -f /usr/include/dwarf.h ]; then
            sudo ln -s "$DW" /usr/include/dwarf.h
          fi
          ls -l /usr/include/dwarf.h || echo "NOTE: no dwarf.h; gendwarfksyms will be disabled"

      # The GKI's binder is written in Rust (drivers/android/binder/*.rs) and
      # gki_defconfig selects CONFIG_ANDROID_BINDER_IPC_RUST. That symbol
      # `depends on RUST`, and RUST is gated on RUST_IS_AVAILABLE, a
      # def_bool $(success, scripts/rust_is_available.sh) probe. Without a Rust
      # toolchain the probe fails, olddefconfig drops RUST, the Rust binder
      # silently disappears, and you end up with a kernel that has no binder
      # driver at all -- which is exactly what happened to the first build.
      #
      # scripts/min-tool-version.sh requires rustc >= 1.85.0 and
      # bindgen >= 0.71.1. RUSTC_LLVM_COMPATIBLE wants the Rust and clang LLVM
      # major versions to agree, so the Rust toolchain below is the one that
      # ships its own matching rustc.
      - name: Install Rust toolchain (required for the Rust binder)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.85.0 --profile minimal \
                       --component rust-src,clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version
          # bindgen is a cargo binary; the kernel invokes it as $BINDGEN.
          cargo install bindgen-cli --version 0.71.1 --locked
          bindgen --version
          rustup component add rust-src
          rustc --print sysroot

      # Shallow single-branch fetch, NOT the +archive tarball. gitiles builds
      # +archive on the fly and the transfer silently truncates (observed: 162 MB
      # of a 270 MB archive), which then blows up much later inside tar with a
      # misleading "unexpected end of file". A shallow fetch is additionally
      # verified by git's own pack checksum, so a bad transfer is a hard error
      # at the point of failure instead of a surprise later.
      - name: Fetch kernel/common (android-mainline, shallow)
        run: |
          set -euo pipefail
          mkdir -p "$KSRC"
          cd "$KSRC"
          git init -q .
          git remote add origin https://android.googlesource.com/kernel/common
          git config core.longpaths true
          ok=0
          for attempt in 1 2 3 4 5; do
            if git fetch --depth 1 --no-tags origin refs/heads/android-mainline; then
              ok=1
              break
            fi
            echo "fetch attempt $attempt failed, retrying"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "could not fetch kernel/common"; exit 1; }
          git checkout -q FETCH_HEAD
          SHA="$(git rev-parse HEAD)"
          echo "android-mainline = $SHA" | tee -a "$GITHUB_OUTPUT" -a "$GITHUB_STEP_SUMMARY"
          echo "files: $(git ls-files | wc -l)"
          test -f Makefile

      - name: Report disk before build
        run: df -h /home/runner

      - name: Build (release)
        if: inputs.variant == 'release' || inputs.variant == 'both' || inputs.variant == ''
        run: bash scripts/build-kernel.sh release

      - name: Upload release artifacts
        if: inputs.variant == 'release' || inputs.variant == 'both' || inputs.variant == ''
        uses: actions/upload-artifact@v4
        with:
          name: gki-release
          path: |
            ${{ env.OUT }}/Image
            ${{ env.OUT }}/vmlinux.gz
          retention-days: 30
          if-no-files-found: error

      # Free the object tree before the second build, otherwise the debug leg
      # dies on ENOSPC partway through.
      - name: Clean object tree before debug build
        if: inputs.variant == 'debug' || inputs.variant == 'both'
        run: |
          set -euo pipefail
          cd "$KSRC"
          rm -f "$OUT"/Image "$OUT"/vmlinux.gz
          find . -name '*.o' -delete
          find . -name '*.cmd' -delete
          df -h /home/runner

      - name: "Build (debug: KASAN + UBSAN)"
        if: inputs.variant == 'debug' || inputs.variant == 'both'
        run: bash scripts/build-kernel.sh debug

      - name: Upload debug artifacts
        if: inputs.variant == 'debug' || inputs.variant == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: gki-debug
          path: |
            ${{ env.OUT }}/Image
            ${{ env.OUT }}/vmlinux.gz
          retention-days: 30
          if-no-files-found: error